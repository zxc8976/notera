name: Bug report
description: Report a reproducible problem in NOTERA
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NOTERA. Please remove private or copyrighted source material from logs and examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NOTERA version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, GPU/CPU, model/provider, browser if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact API keys, tokens, personal information, and private document contents.
